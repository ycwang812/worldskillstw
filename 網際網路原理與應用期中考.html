<!DOCTYPE html>
<html lang="zh-Hant">

    <title>網際網路原理與應用（期中考）</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts (Noto Sans TC & Inter) -->

            color: #0f172a;

</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- 頂部導航與進度條 -->
    <header class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 py-4">

                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-xl bg-indigo-600 text-white flex items-center justify-center shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />

                </div>
                
                <!-- 狀態顯示區 -->
                <div class="flex items-center justify-between sm:justify-end gap-4 text-sm">
                    <div class="bg-slate-100 px-3 py-1.5 rounded-lg font-medium text-slate-700">

                    <div id="live-score-badge" class="hidden bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-lg font-medium text-emerald-700">

                    </div>
                </div>
            </div>
            
            <!-- 進度條 -->
            <div class="w-full bg-slate-100 h-2 rounded-full mt-3 overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 py-8">
        
        <!-- 測驗說明與模式切換卡片 -->
        <div class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 mb-8 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div>
                <h2 class="text-base font-bold text-slate-800 mb-1">測驗說明</h2>
                <p class="text-sm text-slate-600 leading-relaxed">
                    點擊選項即可直接作答，系統將即時顯示正確答案與觀念解析。全部完成後可查看總結成績單。
                </p>
            </div>
            <div class="flex items-center gap-2 shrink-0 w-full sm:w-auto">
                <button onclick="resetQuiz()" class="w-full sm:w-auto px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl transition flex items-center justify-center gap-1.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />

                </button>

        </div>

        <!-- 成績總結橫幅 (完成 20 題或點擊交卷時顯示) -->

            <div class="flex flex-col md:flex-row items-center justify-between gap-6">
                <div class="text-center md:text-left">
                    <span class="inline-block px-3 py-1 bg-white/20 rounded-full text-xs font-semibold tracking-wider uppercase mb-2">測驗完成報告</span>
                    <h2 id="result-title" class="text-2xl sm:text-3xl font-bold mb-2">太棒了！你已完成所有題目</h2>
                    <p id="result-feedback" class="text-indigo-100 text-sm sm:text-base max-w-xl">
                        你對網際網路的基礎原理已經有非常紮實的認識！
                    </p>
                </div>
                <div class="bg-white/10 backdrop-blur-sm border border-white/20 rounded-2xl p-5 text-center min-w-[160px]">
                    <div class="text-xs text-indigo-100 font-medium mb-1">最終總分</div>
                    <div class="text-4xl font-extrabold tracking-tight"><span id="final-score">0</span><span class="text-lg font-normal text-indigo-200"> / 100</span></div>
                    <div id="final-stats" class="text-xs text-indigo-100 mt-2">答對 0 / 20 題</div>
                </div>
            </div>
        </div>

        <!-- 題目列表容器 -->
        <div id="quiz-container" class="space-y-6">
            <!-- 題目將透過 JavaScript 動態渲染於此 -->
        </div>

        <!-- 底部操作按鈕 -->
        <div class="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4">
            <button id="submit-all-btn" onclick="showFinalSummary()" class="w-full sm:w-auto px-8 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center gap-2">

                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">

                </svg>
            </span>
            <span id="toast-text">提示訊息</span>
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-12">
        <div class="max-w-4xl mx-auto px-4 text-center text-xs text-slate-500">
            網際網路原理與應用互動式學習測驗 • 基礎入門版
        </div>
    </footer>

    <script>
        // 題庫資料 (包含題目、四個選項、正確答案索引與觀念解析)
        const quizData = [
            {
                id: 1,
                category: "網頁與協定",
                question: "我們平時在瀏覽器網址列輸入 <code>https://www.google.com</code> 來瀏覽網頁時，主要使用的是哪一種網路協定？",
                options: [
                    "HTTPS",
                    "FTP",
                    "SMTP",
                    "SSH"
                ],
                correctIndex: 0,
                explanation: "HTTPS（超文本傳輸安全協定）是瀏覽網頁時最常使用的協定，它在傳統 HTTP 基礎上加入了 SSL/TLS 加密，保護網頁傳輸安全。"
            },
            {
                id: 2,
                category: "網域名稱系統",
                question: "網域名稱系統（DNS）在網際網路中扮演「網路電話簿」的角色，它的主要功能是什麼？",
                options: [
                    "阻擋惡意網站與電腦病毒入侵",
                    "將好記的網域名稱轉換成電腦看得懂的 IP 位址",
                    "自動幫家裡的電腦分配 Wi-Fi 密碼",
                    "加快影片下載與線上遊戲的傳輸速度"
                ],
                correctIndex: 1,
                explanation: "人類容易記憶像 www.google.com 這樣的文字網址，但網路設備需要透過數字組成的 IP 位址才能找到對方，DNS 負責將兩者進行對應轉換。"
            },
            {
                id: 3,
                category: "IP 位址基礎",
                question: "下列哪一個選項是格式正確的傳統 IPv4 位址？",
                options: [
                    "<code>192.168.1.300</code>",
                    "<code>192.168.1</code>",
                    "<code>192.168.1.1</code>",
                    "<code>www.192.168.1.1</code>"
                ],
                correctIndex: 2,
                explanation: "IPv4 位址由 4 組介於 0 到 255 之間的十進位數字組成，中間以小數點分隔（例如 192.168.1.1）。300 超過了最大值 255。"
            },
            {
                id: 4,
                category: "網頁狀態碼",

                options: [
                    "你的電腦網路線沒有插好",
                    "網站伺服器正在進行系統維護中",
                    "你的帳號密碼輸入錯誤",
                    "伺服器找不到使用者所請求的網頁或資源"

                correctIndex: 3,
                explanation: "HTTP 狀態碼 404 代表「找不到資源」，通常是因為網址輸入錯誤，或是該網頁已經被網站管理員移除或更改路徑。"
            },
            {
                id: 5,
                category: "網路設備",
                question: "家中或辦公室常見的「路由器」（Router，俗稱 IP 分享器）最核心的功能是什麼？",
                options: [
                    "連接不同的網路並決定資料封包的傳送路徑",
                    "幫電腦螢幕提升畫面解析度",
                    "儲存網站所有的圖片與影片檔案",
                    "掃描並清除隨身碟裡的電腦病毒"

                correctIndex: 0,
                explanation: "路由器的主要任務是連接內部區域網路（如家裡的所有設備）與外部網際網路，並為資料封包尋找最佳的傳送路徑。"
            },
            {

            },
            {
                id: 12,

                explanation: "防火牆就像網路的警衛，會依據預先設定的安全規則檢查所有進出的網路封包，允許合法流量通過並阻擋可疑的連線請求。"

                id: 17,
                category: "虛擬私人網路",
                question: "許多上班族在咖啡廳使用公共 Wi-Fi 連回公司內部系統時，會開啟「VPN」（虛擬私人網路）。使用 VPN 的主要目的是什麼？",
                options: [
                    "在公共網路上建立一條加密通道，保護資料安全並連入特定內部網路",
                    "讓手機電池的續航力延長兩倍",
                    "免費升級成 5G 行動網路吃到飽",
                    "自動翻譯外國網站的語言"
                ],
                correctIndex: 0,
                explanation: "VPN 能在不安全的公共網路上建立一條加密的虛擬通道，不僅能防止資料在咖啡廳等公共 Wi-Fi 被竊聽，也能安全存取公司內網資源。"
            },
            {
                id: 18,
                category: "網路診斷工具",
                question: "在進行網路故障排除時，工程師常會在命令提示字元輸入 <code>ping www.google.com</code>。這個 <code>ping</code> 指令主要用來測試什麼？",
                options: [
                    "測試電腦顯示卡的 3D 繪圖效能",
                    "測試本機與目標主機之間的網路是否連通，以及封包往返的延遲時間",
                    "查詢目前電腦裡儲存了多少張照片",
                    "自動修復損壞的作業系統檔案"
                ],
                correctIndex: 1,
                explanation: "ping 是最基礎的網路診斷指令，透過發送 ICMP 回應請求封包，測試目標伺服器是否有回應以及網路延遲（毫秒 ms）狀況。"
            },
            {
                id: 19,
                category: "雲端應用",
                question: "我們常聽到的「雲端運算」（Cloud Computing），例如使用 Google 雲端硬碟或線上文書編輯，它的基本運作概念是什麼？",
                options: [
                    "必須在天氣晴朗、沒有雲層的時候才能正常使用",
                    "把所有的資料都儲存在自己電腦的 C 槽硬碟裡",
                    "透過網際網路存取遠端大型資料中心的儲存空間與運算資源",
                    "利用衛星直接把資料傳送到外太空保存"
                ],
                correctIndex: 2,
                explanation: "雲端運算是指透過網際網路，按需使用遠端伺服器叢集提供的儲存空間、軟體服務與運算能力，讓使用者隨時隨地都能跨裝置存取資料。"
            },
            {
                id: 20,
                category: "資訊安全意識",
                question: "在網路資訊安全宣導中，經常提醒大家要小心「網路釣魚」（Phishing）攻擊。下列哪一種行為最符合網路釣魚的特徵？",
                options: [
                    "在線上購物網站使用信用卡購買釣魚用具",
                    "利用大量流量癱瘓某個官方網站的伺服器",
                    "在論壇上發表與主題無關的廣告留言",
                    "偽裝成銀行或知名網站寄發假冒通知，誘騙使用者點擊連結並輸入帳號密碼"
                ],
                correctIndex: 3,
                explanation: "網路釣魚（Phishing）是常見的社交工程詐騙手法，駭客會製作與官方極為相似的假網站或假簡訊，誘騙受害者主動交出帳密或金融資訊。"
            }
        ];

        // 狀態管理
        let userAnswers = new Array(quizData.length).fill(null);
        const optionLetters = ['A', 'B', 'C', 'D'];

        // 初始化渲染題目
        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            quizData.forEach((item, qIndex) => {
                const userAnswer = userAnswers[qIndex];
                const isAnswered = userAnswer !== null;

                const card = document.createElement('div');
                card.id = `question-card-${qIndex}`;
                card.className = `bg-white rounded-2xl border ${isAnswered ? 'border-slate-300' : 'border-slate-200'} p-5 sm:p-7 shadow-sm transition-all`;

                // 題目標頭與分類標籤
                let statusBadge = '';
                if (isAnswered) {
                    if (userAnswer === item.correctIndex) {
                        statusBadge = `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                            答對了
                        </span>`;
                    } else {
                        statusBadge = `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-50 text-rose-700 border border-rose-200">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                            答錯了
                        </span>`;
                    }
                }

                // 選項 HTML 生成
                const optionsHtml = item.options.map((opt, optIndex) => {
                    let btnClass = "option-card w-full text-left p-3.5 sm:p-4 rounded-xl border flex items-start gap-3.5 ";
                    let badgeClass = "w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold shrink-0 mt-0.5 ";
                    let rightIcon = "";

                    if (!isAnswered) {
                        btnClass += "bg-white border-slate-200 hover:border-indigo-400 hover:bg-indigo-50/40 cursor-pointer text-slate-700";
                        badgeClass += "bg-slate-100 text-slate-600";
                    } else {
                        btnClass += "disabled cursor-default ";
                        if (optIndex === item.correctIndex) {
                            // 正確答案樣式
                            btnClass += "bg-emerald-50/80 border-emerald-500 text-emerald-950 font-medium";
                            badgeClass += "bg-emerald-600 text-white";
                            rightIcon = `<span class="ml-auto text-emerald-600 shrink-0 mt-0.5">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </span>`;
                        } else if (optIndex === userAnswer) {
                            // 使用者選錯的選項樣式
                            btnClass += "bg-rose-50/80 border-rose-400 text-rose-950";
                            badgeClass += "bg-rose-500 text-white";
                            rightIcon = `<span class="ml-auto text-rose-500 shrink-0 mt-0.5">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </span>`;
                        } else {
                            // 其他未選選項
                            btnClass += "bg-slate-50/50 border-slate-200 text-slate-400 opacity-75";
                            badgeClass += "bg-slate-100 text-slate-400";
                        }
                    }

                    return `
                        <button type="button" onclick="selectOption(${qIndex}, ${optIndex})" ${isAnswered ? 'disabled' : ''} class="${btnClass}">
                            <span class="${badgeClass}">${optionLetters[optIndex]}</span>
                            <span class="text-sm sm:text-base leading-relaxed">${opt}</span>
                            ${rightIcon}
                        </button>
                    `;
                }).join('');

                // 解析區塊 (作答後顯示)
                const explanationHtml = isAnswered ? `
                    <div class="mt-4 p-4 rounded-xl bg-slate-50 border border-slate-200/80 text-sm text-slate-700 leading-relaxed flex items-start gap-3">
                        <div class="text-indigo-600 shrink-0 mt-0.5">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                            </svg>
                        </div>
                        <div>
                            <span class="font-bold text-slate-900 block mb-0.5">觀念解析：</span>
                            ${item.explanation}
                        </div>
                    </div>
                ` : '';

                card.innerHTML = `
                    <div class="flex items-center justify-between gap-2 mb-3">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-md bg-indigo-50 text-indigo-700">
                                第 ${item.id} 題
                            </span>
                            <span class="text-xs font-medium text-slate-500">
                                ${item.category}
                            </span>
                        </div>
                        ${statusBadge}
                    </div>
                    <h3 class="text-base sm:text-lg font-bold text-slate-900 leading-snug mb-4">
                        ${item.question}
                    </h3>
                    <div class="space-y-2.5">
                        ${optionsHtml}
                    </div>
                    ${explanationHtml}
                `;

                container.appendChild(card);
            });

            updateProgress();
        }

        // 選擇答案處理
        function selectOption(qIndex, optIndex) {
            if (userAnswers[qIndex] !== null) return; // 避免重複作答

            userAnswers[qIndex] = optIndex;
            renderQuiz();

            // 檢查是否全部作答完畢
            const answeredCount = userAnswers.filter(ans => ans !== null).length;
            if (answeredCount === quizData.length) {
                showFinalSummary(false);
                showToast("恭喜完成全部 20 題！可點擊下方按鈕查看總結報告。");
            }
        }

        // 更新頂部進度條與分數
        function updateProgress() {
            const answeredCount = userAnswers.filter(ans => ans !== null).length;
            const correctCount = userAnswers.reduce((acc, ans, idx) => {
                return acc + (ans === quizData[idx].correctIndex ? 1 : 0);
            }, 0);

            const percentage = (answeredCount / quizData.length) * 100;
            document.getElementById('progress-text').textContent = `${answeredCount} / ${quizData.length}`;
            document.getElementById('progress-bar').style.width = `${percentage}%`;

            const liveScoreBadge = document.getElementById('live-score-badge');
            if (answeredCount > 0) {
                liveScoreBadge.classList.remove('hidden');
                document.getElementById('score-text').textContent = correctCount * 5;
            } else {
                liveScoreBadge.classList.add('hidden');
            }
        }

        // 顯示最終成績總結
        function showFinalSummary(shouldScroll = true) {
            const answeredCount = userAnswers.filter(ans => ans !== null).length;
            if (answeredCount < quizData.length) {
                const unanswered = quizData.length - answeredCount;
                showToast(`還有 ${unanswered} 題尚未作答喔！請完成所有題目。`);
                // 自動捲動到第一題未作答的題目
                const firstUnansweredIdx = userAnswers.findIndex(ans => ans === null);
                if (firstUnansweredIdx !== -1) {
                    const targetCard = document.getElementById(`question-card-${firstUnansweredIdx}`);
                    targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                return;
            }

            const correctCount = userAnswers.reduce((acc, ans, idx) => {
                return acc + (ans === quizData[idx].correctIndex ? 1 : 0);
            }, 0);
            const score = correctCount * 5;

            const banner = document.getElementById('result-banner');
            const titleEl = document.getElementById('result-title');
            const feedbackEl = document.getElementById('result-feedback');
            
            document.getElementById('final-score').textContent = score;
            document.getElementById('final-stats').textContent = `答對 ${correctCount} / ${quizData.length} 題`;

            if (score === 100) {
                titleEl.textContent = "滿分過關！網際網路小達人 🏆";
                feedbackEl.textContent = "太厲害了！20 題全數答對，你對網際網路的運作原理與安全觀念非常清晰！";
            } else if (score >= 80) {
                titleEl.textContent = "表現非常優異！👏";
                feedbackEl.textContent = "你已經掌握了絕大部分的網路基礎知識，可以往下瀏覽錯題的觀念解析來補足細節。";
            } else if (score >= 60) {
                titleEl.textContent = "順利及格！繼續加油 💪";
                feedbackEl.textContent = "具備不錯的基礎概念囉！建議多留意不熟悉的協定名稱與網路設備功能。";
            } else {
                titleEl.textContent = "再接再厲！多練習幾次就會熟練 📚";
                feedbackEl.textContent = "網路專有名詞一開始比較容易混淆，建議仔細閱讀每題下方的「觀念解析」後再挑戰一次！";
            }

            banner.classList.remove('hidden');
            if (shouldScroll) {
                banner.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // 重新測驗
        function resetQuiz() {
            userAnswers = new Array(quizData.length).fill(null);
            document.getElementById('result-banner').classList.add('hidden');
            renderQuiz();
            scrollToTop();
            showToast("測驗已重置，請重新開始作答！");
        }

        // 回到頂部
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 自訂 Toast 提示框
        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('toast-message');
            document.getElementById('toast-text').textContent = message;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3200);
        }

        // 頁面載入後初始化
        window.onload = function() {
            renderQuiz();
        };
    </script>
</body>
</html>
